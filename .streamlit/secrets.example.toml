# Merge this template into the host's secret store. Never commit secrets.toml.
# Requires Python 3.11 and streamlit[auth] from requirements.txt.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"

[auth.google]
client_id = "REPLACE_WITH_GOOGLE_OIDC_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_OIDC_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[reviewer_auth]
# Empty intentionally: nobody has access until the administrator fills this list.
allowed_emails = []

# Keep the existing Google service-account and other application secrets.
# Google user login and the server service account are separate credentials.
